# Application ACL applies to every custom command once AppManifest is enabled.
# Keep this explicit host surface separate from plugin-runtime and plugin-smoke.
# Registering a new command also requires an intentional permission decision;
# capability_tests checks the actual generated authority against the app handler.
[[permission]]
identifier = "allow-host-commands"
description = "Allows the existing application command surface from the local main webview."
commands.allow = [
  # Application status, time and scheduler.
  "ping",
  "get_version",
  "get_server_time",
  "get_time_snapshot",
  "sync_time_now",
  "get_environment_status",
  "scheduler_run_task",
  # Configuration, notifications and account preferences.
  "get_config",
  "save_config",
  "update_general_settings",
  "get_notification_settings",
  "update_notification_settings",
  "list_notifications",
  "get_notification_summary",
  "mark_notification_read",
  "mark_visible_notifications_read",
  "delete_notification",
  "clear_account_notifications",
  "create_client_notification",
  "get_risk_status",
  "update_risk_config",
  "save_credentials",
  "has_credentials",
  "save_window_size",
  "list_account_profiles",
  "switch_account",
  "delete_account",
  # Connections, charts and market data.
  "connect",
  "disconnect",
  "get_connection_status",
  "get_websocket_status",
  "test_connection",
  "set_active_symbol",
  "set_kline_interval",
  "set_chart_context",
  "load_chart_workspace",
  "save_chart_workspace",
  "refresh_market",
  "refresh_funding_rate",
  "fetch_ticker",
  "fetch_depth",
  "fetch_klines",
  "fetch_public_trades",
  "fetch_funding_rate_history",
  "fetch_mark_price_klines",
  "fetch_instruments",
  "fetch_risk_limit",
  "fetch_market_close_time",
  "fetch_fiat_rate",
  # Existing trading commands retain their backend validation and risk checks.
  "place_order",
  "list_pending_order_submissions",
  "acknowledge_order_submission",
  "reconcile_order_submission",
  "cancel_order",
  "refresh_orders",
  "cancel_all_orders",
  "replace_order",
  "fetch_orders",
  "fetch_trade_fills",
  "fetch_fee_rate",
  "set_leverage",
  "add_margin",
  "close_all_positions",
  "fetch_closed_pnl",
  "create_tpsl",
  "replace_tpsl",
  "switch_margin_mode",
  "switch_separate_position_mode",
  # Account data and diagnostics.
  "refresh_account",
  "refresh_balances",
  "refresh_positions",
  "fetch_funding_balances",
  "transfer_funds",
  "fetch_user_id",
  "fetch_transfer_history",
  "get_trade_stats",
  "export_trade_log",
  "probe_private_endpoints",
  "refresh_order_history",
  "refresh_private_panels",
]
