name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked --all-targets
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets
        working-directory: src-tauri

  plugin-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run nonzero plugin lifecycle security suites
        shell: pwsh
        run: |
          $suites = @(
            'plugin::discovery::safe_fs::tests',
            'plugin::import',
            'storage::local_plugin_import',
            'storage::plugin_state::tests',
            'plugin::runtime::import::tests',
            'storage::managed_plugin_ownership::tests',
            'storage::local_plugin_package::tests',
            'plugin::ownership::tests',
            'plugin::runtime::removal::tests'
          )
          foreach ($suite in $suites) {
            $listed = @(& cargo test --locked --manifest-path src-tauri/Cargo.toml $suite --lib -- --list --format terse)
            $listExit = $LASTEXITCODE
            if ($listExit -ne 0) { throw "plugin-security list failed with exit $listExit`: $suite" }
            $selected = @($listed | Where-Object { $_ -match ':\s+test$' })
            if ($selected.Count -eq 0) { throw "plugin-security filter selected zero tests: $suite" }
            & cargo test --locked --manifest-path src-tauri/Cargo.toml $suite --lib
            $runExit = $LASTEXITCODE
            if ($runExit -ne 0) { throw "plugin-security suite failed with exit $runExit`: $suite" }
          }
