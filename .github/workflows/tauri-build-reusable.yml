name: Tauri Build (reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      news_api_base_url:
        required: true
        type: string
      news_source_epoch:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config libdbus-1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install
      - name: Build news provisioning utility
        env:
          EASIFLUX_NEWS_API_BASE_URL: ${{ inputs.news_api_base_url }}
          EASIFLUX_NEWS_SOURCE_EPOCH: ${{ inputs.news_source_epoch }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin easiflux-news-provision
      - name: Prepare news provisioning release assets
        id: news-provision
        shell: pwsh
        run: |
          $hostLine = rustc -vV | Select-String '^host: '
          if (-not $hostLine) {
            throw 'Unable to determine the Rust host triple'
          }
          $hostTriple = $hostLine.Line.Substring(6).Trim()
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps | ConvertFrom-Json
          $source = Join-Path (Join-Path $metadata.target_directory 'release') "easiflux-news-provision$extension"
          $asset = "easiflux-news-provision-$hostTriple$extension"
          $checksum = "$asset.sha256"
          Copy-Item -LiteralPath $source -Destination $asset -ErrorAction Stop

          if ($IsWindows) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -LiteralPath $checksum -NoNewline -Encoding ascii
          } elseif ($IsMacOS) {
            shasum -a 256 -- $asset | Set-Content -LiteralPath $checksum -NoNewline -Encoding ascii
            if ($LASTEXITCODE -ne 0) { throw 'SHA-256 generation failed' }
          } else {
            sha256sum -- $asset | Set-Content -LiteralPath $checksum -NoNewline -Encoding ascii
            if ($LASTEXITCODE -ne 0) { throw 'SHA-256 generation failed' }
          }

          "asset=$asset" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EASIFLUX_NEWS_API_BASE_URL: ${{ inputs.news_api_base_url }}
          EASIFLUX_NEWS_SOURCE_EPOCH: ${{ inputs.news_source_epoch }}
        with:
          tagName: ${{ inputs.tag_name }}
          releaseName: 'EasiFlux Desktop ${{ inputs.tag_name }}'
          releaseBody: 'See assets for platform builds.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Upload news provisioning release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_RELEASE_TAG: ${{ inputs.tag_name }}
          NEWS_PROVISION_ASSET: ${{ steps.news-provision.outputs.asset }}
          NEWS_PROVISION_CHECKSUM: ${{ steps.news-provision.outputs.checksum }}
        run: |
          gh release upload -- $env:NEWS_RELEASE_TAG $env:NEWS_PROVISION_ASSET $env:NEWS_PROVISION_CHECKSUM
          if ($LASTEXITCODE -ne 0) { throw 'Provisioning asset upload failed' }
